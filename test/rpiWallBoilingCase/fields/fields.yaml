# Field registry.
SonicFile:
  object: fields
  type: registry
T:
  type: scalar
  domain: fluid
  location: point
  dimensions: [0, 0, 0, 1, 0, 0, 0]
  storage: primary
  output: false
T.liquid:
  type: scalar
  domain: fluid
  location: point
  dimensions: [0, 0, 0, 1, 0, 0, 0]
  storage: primary
  output: true
T.vapor:
