# Runtime configuration.
SonicFile:
  object: solver
  type: runtime
startTime: 0
endTime: 0.02
endStep: 50
CFL: 0.3
maxDeltaT: 0.0002
writeControl: timeStep
writeInterval: 5
output:
  jobName: VariationalIBM
  outputDir: result
parallel:
  enabled: false
  nProcs: 1
  split: [1, 1, 1]
  haloTolerance: 1e-08
