# Solver algorithm.
SonicFile:
  object: solver
  type: algorithm
type: densityBase
# No pressure coupling preset: this equation system has no pressure constraint.
linearSolvers:
  pressure:
    backend: hypre
    solver: flexGMRES
    preconditioner: boomerAMG
    maxIterations: 3000
    krylovDimension: 50
    relativeTolerance: 1e-08
    absoluteTolerance: 1e-12
    structureRebuildInterval: 0
  momentum:
    backend: hypre
    solver: flexGMRES
    preconditioner: boomerAMG
    maxIterations: 3000
    krylovDimension: 50
    relativeTolerance: 1e-08
    absoluteTolerance: 1e-12
    structureRebuildInterval: 0
  energy:
    backend: hypre
    solver: flexGMRES
    preconditioner: boomerAMG
    maxIterations: 3000
    krylovDimension: 50
    relativeTolerance: 1e-08
    absoluteTolerance: 1e-12
    structureRebuildInterval: 0
