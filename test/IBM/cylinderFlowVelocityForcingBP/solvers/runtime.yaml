# Runtime configuration.
SonicFile:
  object: solver
  type: runtime
startTime: 0
endTime: 5.0
CFL: 0.3
maxDeltaT: 0.01
writeControl: runTime
writeInterval: 0.1
writeInitial: true
output:
  jobName: CylinderFlowVelocityForcingBP
  outputDir: result
parallel:
  enabled: false
  nProcs: 1
  split: [1, 1, 1]
  haloTolerance: 1e-05
