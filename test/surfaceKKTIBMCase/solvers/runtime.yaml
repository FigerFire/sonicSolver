# Runtime configuration.
SonicFile:
  object: solver
  type: runtime
startTime: 0
endTime: 0.001
endStep: 3
CFL: 0.2
maxDeltaT: 0.0001
writeControl: timeStep
writeInterval: 1
output:
  jobName: SurfaceKKTIBM
  outputDir: result
parallel:
  enabled: false
  nProcs: 1
  split: [1, 1, 1]
  haloTolerance: 1e-08
