# Runtime configuration.
SonicFile:
  object: solver
  type: runtime
startTime: 0
endTime: 0.0001
endStep: 1
CFL: 0.5
writeControl: runTime
writeInterval: 0.001
output:
  jobName: MixerVessel2DLevelSet
  outputDir: result
parallel:
  enabled: true
  nProcs: 2
  split: [2, 1, 1]
  haloTolerance: 1e-08
